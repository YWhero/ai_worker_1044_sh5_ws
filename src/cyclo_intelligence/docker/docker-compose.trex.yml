# Explicit T-Rex flavor for the existing `lerobot` service.
#
# Layer this after docker-compose.yml when (re)starting cyclo_intelligence.
# This override passes the same selector to supervisor_api so later
# lerobot_server recreates continue to use the T-Rex image.
services:
  cyclo_intelligence:
    environment:
      # Keep supervisor_api on the T-Rex image when it later starts or
      # recreates lerobot_server.  Defining this in the override makes the
      # flavor selection persistent without relying on a caller's shell env.
      - CYCLO_LEROBOT_POLICY_FLAVOR=trex
      # Propagate the local smooth-playback profile through supervisor-driven
      # backend recreates as well as direct host-side Compose commands.
      - TREX_RUNTIME_ACTION_HZ=${TREX_RUNTIME_ACTION_HZ:-1.25}
      - TREX_REFILL_MARGIN_S=${TREX_REFILL_MARGIN_S:-2.0}

  lerobot:
    image: ${CYCLO_LEROBOT_TREX_IMAGE:-robotis/lerobot-trex-zenoh:1.3.2-${ARCH:-arm64}}
    environment:
      # The Jetson base image points its legacy cache variables at /data.
      # Keep every Hugging Face client on the cache already mounted by the
      # canonical lerobot service.
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_CACHE=/root/.cache/huggingface/hub
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/hub
      # Native T-Rex's first CUDA call is slower than the steady-state call
      # (about 5.8 s on the target SH5 Jetson).  Keep the stale-response guard,
      # but do not abandon that valid warm-up chunk at the common 5 s default.
      - GET_ACTION_TIMEOUT_S=${TREX_GET_ACTION_TIMEOUT_S:-30.0}
      # The SH5 c16 checkpoint produces one second of 15 Hz source actions but
      # needs 3.1-4.8 s per inference on the onboard Jetson.  Play the source
      # trajectory conservatively at a server-local rate so async prefetch can
      # finish before the 100 Hz output buffer drains.  A deployment can
      # override these values for a faster or longer-horizon checkpoint.
      - INFERENCE_HZ=${TREX_RUNTIME_ACTION_HZ:-1.25}
      - REFILL_MARGIN_S=${TREX_REFILL_MARGIN_S:-2.0}
    volumes:
      # Checkpoint 0807 was trained against this exact qwen_vla source hash.
      # Mount it over the generic workspace checkout without modifying the
      # previous T-Rex source kept on the host.
      - ./workspace/T-Rex-SH5-0807:/workspace/T-Rex-SH5:ro
    build:
      args:
        LEROBOT_POLICY_FLAVOR: trex
